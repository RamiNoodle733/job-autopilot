name: Temporary Ulamaa Playlist Transcript Extraction

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  extract:
    if: github.head_ref == 'tmp/ulamaa-playlist-transcripts-20260719'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install transcript tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install yt-dlp youtube-transcript-api
      - name: Extract playlist metadata and transcripts
        env:
          PLAYLIST_URL: https://www.youtube.com/playlist?list=PLv6TZluNhDk5iw5N-FEXJ419yBLhLgJkp
        run: |
          cat > /tmp/extract_playlist.py <<'PY'
          import csv
          import html
          import json
          import os
          import re
          import subprocess
          import sys
          import time
          from pathlib import Path

          PLAYLIST_URL = os.environ['PLAYLIST_URL']
          OUT = Path('playlist_transcripts')
          RAW = OUT / 'raw'
          TXT = OUT / 'transcripts'
          RAW.mkdir(parents=True, exist_ok=True)
          TXT.mkdir(parents=True, exist_ok=True)

          def run(cmd, timeout=1200):
              print('+', ' '.join(cmd), flush=True)
              return subprocess.run(cmd, text=True, capture_output=True, timeout=timeout)

          def clean_vtt(text):
              lines = []
              seen = set()
              for raw in text.splitlines():
                  line = raw.strip().lstrip('\ufeff')
                  if not line or line == 'WEBVTT' or line.startswith(('Kind:', 'Language:', 'NOTE')):
                      continue
                  if re.match(r'^\d+$', line) or '-->' in line or line.startswith(('X-TIMESTAMP-MAP', 'STYLE', 'REGION')):
                      continue
                  line = re.sub(r'<[^>]+>', '', line)
                  line = html.unescape(line)
                  line = re.sub(r'\s+', ' ', line).strip()
                  if not line or line in seen:
                      continue
                  seen.add(line)
                  lines.append(line)
              return '\n'.join(lines)

          p = run(['yt-dlp', '--flat-playlist', '--dump-single-json', PLAYLIST_URL], timeout=600)
          if p.returncode != 0:
              print(p.stdout)
              print(p.stderr, file=sys.stderr)
              raise SystemExit('Could not read playlist')
          playlist = json.loads(p.stdout)
          (OUT / 'playlist.json').write_text(json.dumps(playlist, ensure_ascii=False, indent=2), encoding='utf-8')
          entries = [e for e in (playlist.get('entries') or []) if e and e.get('id')]
          print(f'Playlist: {playlist.get("title")} | videos={len(entries)}', flush=True)

          manifest = []
          failures = []
          for idx, entry in enumerate(entries, 1):
              vid = entry['id']
              title = entry.get('title') or vid
              url = f'https://www.youtube.com/watch?v={vid}'
              prefix = f'{idx:03d}_{vid}'
              print(f'\n[{idx}/{len(entries)}] {title}', flush=True)

              cmd = [
                  'yt-dlp', '--skip-download', '--ignore-errors',
                  '--write-info-json', '--write-subs', '--write-auto-subs',
                  '--sub-format', 'vtt', '--sub-langs', 'en.*,en,ar.*,ar',
                  '--sleep-requests', '1', '--retries', '5', '--fragment-retries', '5',
                  '-o', str(RAW / (prefix + '.%(ext)s')), url,
              ]
              r = run(cmd, timeout=1200)
              (RAW / f'{prefix}.log.txt').write_text((r.stdout or '') + '\n--- STDERR ---\n' + (r.stderr or ''), encoding='utf-8')

              vtts = sorted(RAW.glob(prefix + '.*.vtt'))
              transcript_sources = []
              parts = []
              for vtt in vtts:
                  cleaned = clean_vtt(vtt.read_text(encoding='utf-8', errors='replace'))
                  if cleaned:
                      transcript_sources.append(vtt.name)
                      parts.append(f'[{vtt.name}]\n{cleaned}')

              # Fallback to youtube-transcript-api when yt-dlp did not save captions.
              if not parts:
                  try:
                      from youtube_transcript_api import YouTubeTranscriptApi
                      api = YouTubeTranscriptApi()
                      listing = api.list(vid)
                      candidates = []
                      for tr in listing:
                          score = 0
                          code = (tr.language_code or '').lower()
                          if code.startswith('en'):
                              score += 100
                          elif code.startswith('ar'):
                              score += 80
                          if not tr.is_generated:
                              score += 20
                          candidates.append((score, tr))
                      candidates.sort(key=lambda x: x[0], reverse=True)
                      for _, tr in candidates[:2]:
                          fetched = tr.fetch()
                          body = '\n'.join(re.sub(r'\s+', ' ', s.text).strip() for s in fetched if getattr(s, 'text', '').strip())
                          if body:
                              name = f'youtube-transcript-api.{tr.language_code}.txt'
                              transcript_sources.append(name)
                              parts.append(f'[{name}]\n{body}')
                  except Exception as exc:
                      failures.append({'index': idx, 'video_id': vid, 'title': title, 'error': repr(exc)})

              transcript_path = TXT / f'{prefix}.txt'
              header = [
                  f'Lesson {idx}',
                  f'Title: {title}',
                  f'Video ID: {vid}',
                  f'URL: {url}',
                  '',
              ]
              if parts:
                  transcript_path.write_text('\n'.join(header) + '\n\n'.join(parts), encoding='utf-8')
                  status = 'transcript saved'
              else:
                  transcript_path.write_text('\n'.join(header) + '[NO TRANSCRIPT COULD BE RETRIEVED]\n', encoding='utf-8')
                  status = 'missing transcript'

              manifest.append({
                  'index': idx,
                  'video_id': vid,
                  'title': title,
                  'duration_seconds': entry.get('duration'),
                  'url': url,
                  'status': status,
                  'sources': '; '.join(transcript_sources),
                  'transcript_file': transcript_path.name,
              })
              time.sleep(1)

          with (OUT / 'manifest.csv').open('w', newline='', encoding='utf-8') as f:
              w = csv.DictWriter(f, fieldnames=list(manifest[0].keys()) if manifest else ['index'])
              w.writeheader()
              w.writerows(manifest)
          (OUT / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (OUT / 'failures.json').write_text(json.dumps(failures, ensure_ascii=False, indent=2), encoding='utf-8')
          summary = {
              'playlist_title': playlist.get('title'),
              'uploader': playlist.get('uploader'),
              'video_count': len(entries),
              'transcripts_saved': sum(m['status'] == 'transcript saved' for m in manifest),
              'missing_transcripts': sum(m['status'] == 'missing transcript' for m in manifest),
          }
          (OUT / 'summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY
          python /tmp/extract_playlist.py
      - name: Upload transcript package
        uses: actions/upload-artifact@v4
        with:
          name: ulamaa-playlist-transcripts
          path: playlist_transcripts
          if-no-files-found: error
          retention-days: 1
