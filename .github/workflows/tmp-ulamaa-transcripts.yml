name: Temporary Ulamaa Playlist Transcript Extraction

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  extract:
    if: github.head_ref == 'tmp/ulamaa-playlist-transcripts-20260719'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch Arabic original transcript for lesson 4 part 2
        run: |
          python -m pip install requests
          python - <<'PY'
          from pathlib import Path
          import json, requests
          out=Path('specific_language_transcripts'); out.mkdir(exist_ok=True)
          urls={
            '005_KwvY8RxGP_A_ar_orig.txt':'https://youtube-transcript.ai/transcript/KwvY8RxGP_A.txt?lang=a-ar-orig',
            '005_KwvY8RxGP_A_ar.txt':'https://youtube-transcript.ai/transcript/KwvY8RxGP_A.txt?lang=a-ar',
            '009_Y9Mq5JIvOME_ar.txt':'https://youtube-transcript.ai/transcript/Y9Mq5JIvOME.txt?lang=a-ar',
          }
          summary=[]
          s=requests.Session(); s.headers['User-Agent']='Mozilla/5.0'
          for name,url in urls.items():
            try:
              r=s.get(url,timeout=180)
              (out/name).write_bytes(r.content)
              summary.append({'name':name,'url':url,'status':r.status_code,'size':len(r.content),'preview':r.text[:200]})
            except Exception as e:
              summary.append({'name':name,'url':url,'error':repr(e)})
          (out/'summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: ulamaa-specific-language-transcripts
          path: specific_language_transcripts
          if-no-files-found: error
          retention-days: 1
